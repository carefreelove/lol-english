<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英雄联盟英文学习站</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>LoL 英文学习站</h1>
  <nav id="tabs">
    <button data-view="champions" class="active">英雄</button>
    <button data-view="items">装备</button>
    <button data-view="runes">符文</button>
    <button data-view="summoners">召唤师技能</button>
    <button data-view="favorites">生词本 <span id="favCount" class="badge">0</span></button>
    <button data-view="settings">设置</button>
  </nav>
  <span id="metaInfo" class="muted"></span>
</header>

<main id="view"><div class="loading">加载中…</div></main>

<div id="popover" class="hidden" role="dialog"></div>
<div id="modal" class="hidden"></div>
<div id="toast" class="hidden"></div>

<!-- 数据（构建产物，.js 挂到 window.LOL，兼容 file:// 双击打开） -->
<script src="data/text.js"></script>
<script src="data/meta.js"></script>
<script src="data/dict.js"></script>
<script src="data/champions.index.js"></script>
<script src="data/items.js"></script>
<script src="data/summoners.js"></script>
<script src="data/runes.js"></script>
<!-- 应用 -->
<script src="js/store.js"></script>
<script src="js/tts.js"></script>
<script src="js/favorites.js"></script>
<script src="js/wordinfo.js"></script>
<script src="js/annotate.js"></script>
<script src="js/app.js"></script>
</body>
</html>
